name: Construire l'image Cal.diy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche ou tag de calcom/cal.diy a construire"
        default: "main"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Liberer de l'espace disque sur la machine GitHub
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Recuperer le code officiel de Cal.diy
        uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: ${{ inputs.ref }}
          path: src

      - uses: docker/setup-buildx-action@v3

      - name: Connexion au registre d'images GitHub (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier l'image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            CALCOM_TELEMETRY_DISABLED=1
          tags: |
            ghcr.io/moliere177family/cal.diy:latest
            ghcr.io/moliere177family/cal.diy:${{ github.run_number }}
